<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Dashboard - Top 8 Cryptocurrencies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-messaging-compat.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .crypto-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .positive-change {
            color: #4ade80;
        }
        .negative-change {
            color: #f87171;
        }
        .refresh-btn {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }
        .price-up {
            animation: priceUp 1s ease-out;
        }
        .price-down {
            animation: priceDown 1s ease-out;
        }
        @keyframes priceUp {
            0% { color: #4ade80; }
            50% { color: #4ade80; font-weight: bold; }
            100% { color: #e2e8f0; }
        }
        @keyframes priceDown {
            0% { color: #f87171; }
            50% { color: #f87171; font-weight: bold; }
            100% { color: #e2e8f0; }
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #6366f1;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Add this to your existing style tags in all HTML files */

/* Notification styles */
.fixed {
  position: fixed;
}

.top-4 {
  top: 1rem;
}

.right-4 {
  right: 1rem;
}

.z-50 {
  z-index: 50;
}

.bg-green-100 {
  background-color: #dcfce7;
}

.bg-red-100 {
  background-color: #fee2e2;
}

.border-green-500 {
  border-color: #22c55e;
}

.border-red-500 {
  border-color: #ef4444;
}

.border-l-4 {
  border-left-width: 4px;
}

.p-4 {
  padding: 1rem;
}

.rounded-lg {
  border-radius: 0.5rem;
}

.shadow-lg {
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

.flex {
  display: flex;
}

.justify-between {
  justify-content: space-between;
}

.items-start {
  align-items: flex-start;
}

.font-bold {
  font-weight: 700;
}

.text-sm {
  font-size: 0.875rem;
}

.mt-1 {
  margin-top: 0.25rem;
}

.text-gray-500 {
  color: #6b7280;
}

.hover\:text-gray-700:hover {
  color: #374151;
}
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <div class="container mx-auto px-4 py-8">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500">
                Crypto Price Dashboard
            </h1>
            <p class="text-lg text-gray-300 max-w-2xl mx-auto">
                Real-time prices of the top 8 cryptocurrencies by market capitalization
            </p>
        </div>

        <div class="flex justify-center mb-8">
            <button id="refreshBtn" class="refresh-btn px-6 py-3 rounded-full text-white font-semibold flex items-center">
                <span id="refreshText">Refresh Prices</span>
                <span id="refreshIcon" class="ml-2">⟳</span>
            </button>
        </div>

        <div id="loading" class="flex justify-center items-center py-12">
            <div class="loading-spinner"></div>
            <span class="ml-3 text-lg">Fetching crypto data...</span>
        </div>

        <div id="cryptoContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 hidden">
            <!-- Crypto cards will be dynamically inserted here -->
        </div>

        <div class="mt-12 text-center text-gray-400 text-sm">
            <p>Data provided by CoinGecko API. Prices update every 30 seconds automatically.</p>
            <p class="mt-2">Last updated: <span id="lastUpdated"></span></p>
        </div>
    </div>

    <script>
        // Top 8 cryptocurrencies by market cap (IDs from CoinGecko)
        const topCryptoIds = [
            'bitcoin',
            'ethereum',
            'tether',
            'binancecoin',
            'solana',
            'ripple',
            'usd-coin',
            'cardano'
        ];

        // DOM elements
        const cryptoContainer = document.getElementById('cryptoContainer');
        const loadingElement = document.getElementById('loading');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshText = document.getElementById('refreshText');
        const refreshIcon = document.getElementById('refreshIcon');
        const lastUpdatedElement = document.getElementById('lastUpdated');

        // Store previous prices for animation
        let previousPrices = {};

        // Initialize
        fetchCryptoData();
        setInterval(fetchCryptoData, 30000); // Auto-refresh every 30 seconds

        // Set up refresh button
        refreshBtn.addEventListener('click', () => {
            refreshText.textContent = 'Refreshing...';
            refreshIcon.classList.add('animate-spin');
            fetchCryptoData();
        });

        // Fetch crypto data from CoinGecko API
        async function fetchCryptoData() {
            try {
                loadingElement.classList.remove('hidden');
                cryptoContainer.classList.add('hidden');
                
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${topCryptoIds.join('%2C')}&order=market_cap_desc&sparkline=false`
                );
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Store current prices before updating
                const currentPrices = {};
                data.forEach(crypto => {
                    currentPrices[crypto.id] = crypto.current_price;
                });
                
                // Update UI
                updateCryptoUI(data, previousPrices);
                
                // Calculate percentage changes and animate price changes
                if (Object.keys(previousPrices).length > 0) {
                    animatePriceChanges(currentPrices, previousPrices);
                }
                
                // Store current prices for next comparison
                previousPrices = currentPrices;
                
                // Update last updated time
                const now = new Date();
                lastUpdatedElement.textContent = now.toLocaleString();
                
                loadingElement.classList.add('hidden');
                cryptoContainer.classList.remove('hidden');
                refreshText.textContent = 'Refresh Prices';
                refreshIcon.classList.remove('animate-spin');
                
            } catch (error) {
                console.error('Error fetching crypto data:', error);
                loadingElement.classList.add('hidden');
                cryptoContainer.innerHTML = `
                    <div class="col-span-4 text-center py-8">
                        <p class="text-red-400 text-lg">Failed to fetch cryptocurrency data.</p>
                        <p class="text-gray-400 mt-2">Please check your internet connection and try again.</p>
                    </div>
                `;
                cryptoContainer.classList.remove('hidden');
                refreshText.textContent = 'Refresh Prices';
                refreshIcon.classList.remove('animate-spin');
            }
        }

        // Update the UI with crypto data
        function updateCryptoUI(cryptoData, prevPrices) {
            cryptoContainer.innerHTML = '';
            
            cryptoData.forEach(crypto => {
                const change24h = crypto.price_change_percentage_24h;
                const changeClass = change24h >= 0 ? 'positive-change' : 'negative-change';
                const changeSign = change24h >= 0 ? '+' : '';
                
                // Get crypto logo from CoinGecko CDN
                const logoUrl = `https://assets.coingecko.com/coins/images/${getCoinImageId(crypto.id)}/large/${crypto.id}.png`;
                
                // Format numbers
                const price = crypto.current_price.toLocaleString('en-US', {
                    style: 'currency',
                    currency: 'USD'
                });
                
                const marketCap = crypto.market_cap.toLocaleString('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                });
                
                const volume = crypto.total_volume.toLocaleString('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                });
                
                cryptoContainer.innerHTML += `
                    <div class="crypto-card p-6 flex flex-col">
                        <div class="flex items-center mb-4">
                            <img src="${logoUrl}" alt="${crypto.name} logo" class="w-10 h-10 rounded-full" onerror="this.onerror=null;this.src='https://placehold.co/100x100?text=${crypto.symbol.toUpperCase()}'">
                            <div class="ml-3">
                                <h3 class="font-bold text-lg">${crypto.name}</h3>
                                <p class="text-gray-400 text-sm">${crypto.symbol.toUpperCase()}</p>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <p class="text-2xl font-semibold mb-1 crypto-price" data-id="${crypto.id}">${price}</p>
                            <p class="${changeClass} text-sm">${changeSign}${change24h.toFixed(2)}% (24h)</p>
                        </div>
                        
                        <div class="mt-auto pt-4 border-t border-gray-700">
                            <div class="flex justify-between text-sm">
                                <span class="text-gray-400">Market Cap:</span>
                                <span>${marketCap}</span>
                            </div>
                            <div class="flex justify-between text-sm mt-1">
                                <span class="text-gray-400">Volume (24h):</span>
                                <span>${volume}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Animate price changes
        function animatePriceChanges(currentPrices, prevPrices) {
            Object.keys(currentPrices).forEach(id => {
                const priceElement = document.querySelector(`.crypto-price[data-id="${id}"]`);
                if (!priceElement) return;
                
                const currentPrice = currentPrices[id];
                const prevPrice = prevPrices[id];
                
                if (currentPrice > prevPrice) {
                    priceElement.classList.add('price-up');
                    setTimeout(() => priceElement.classList.remove('price-up'), 1000);
                } else if (currentPrice < prevPrice) {
                    priceElement.classList.add('price-down');
                    setTimeout(() => priceElement.classList.remove('price-down'), 1000);
                }
            });
        }

        // Helper function to get CoinGecko coin image ID
        function getCoinImageId(coinId) {
            const coinImageMap = {
                'bitcoin': 1,
                'ethereum': 279,
                'tether': 325,
                'binancecoin': 825,
                'solana': 4128,
                'ripple': 44,
                'usd-coin': 3408,
                'cardano': 975
            };
            return coinImageMap[coinId] || 1;
        }

};
    </script>
</body>
</html>
