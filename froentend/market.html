<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .table-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }
    .table-row:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="bg-purple-700 text-white shadow-lg">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold">CryptoDash</h1>
      <ul class="flex space-x-6">
        <li><a href="index.html" class="hover:text-gray-200">Home</a></li>
        <li><a href="market.html" class="font-semibold underline">Market</a></li>
        <li><a href="news.html" class="hover:text-gray-200">News</a></li>
      </ul>
    </div>
  </nav>

  <!-- Market Data Section -->
  <section class="container mx-auto px-6 py-10">
    <h2 class="text-3xl font-bold text-purple-700 mb-6 text-center">Top Cryptocurrencies</h2>
    <div class="overflow-x-auto bg-gray-800 shadow-md rounded-lg">
      <table class="min-w-full border-collapse">
        <thead class="table-header text-white">
          <tr>
            <th class="px-6 py-3 text-left">Rank</th>
            <th class="px-6 py-3 text-left">Name</th>
            <th class="px-6 py-3 text-left">Symbol</th>
            <th class="px-6 py-3 text-left">Price (USD)</th>
            <th class="px-6 py-3 text-left">Market Cap</th>
          </tr>
        </thead>
        <tbody id="crypto-table" class="divide-y divide-gray-700">
          <!-- Data will load here -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- Script to Fetch Data -->
  <script>
    async function loadCryptoData() {
      try {
        let res = await fetch("http://127.0.0.1:8000/cryptos"); // Backend API
        let data = await res.json();

        let tableBody = document.getElementById("crypto-table");
        tableBody.innerHTML = "";

        data.forEach((coin, index) => {
          let row = `
            <tr class="table-row">
              <td class="px-6 py-3">${index + 1}</td>
              <td class="px-6 py-3">${coin.name}</td>
              <td class="px-6 py-3">${coin.symbol.toUpperCase()}</td>
              <td class="px-6 py-3">$${coin.current_price.toLocaleString()}</td>
              <td class="px-6 py-3">$${coin.market_cap.toLocaleString()}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });
      } catch (err) {
        console.error("Error fetching crypto data:", err);
      }
    }

    loadCryptoData();
  </script>
</body>
</html>
