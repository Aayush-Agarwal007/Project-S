<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto News</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <!-- Navbar -->
  <nav class="bg-purple-700 text-white shadow-lg">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold">CryptoDash</h1>
      <ul class="flex space-x-6">
        <li><a href="index.html" class="hover:text-gray-200">Home</a></li>
        <li><a href="market.html" class="hover:text-gray-200">Market</a></li>
        <li><a href="news.html" class="font-semibold underline">News</a></li>
      </ul>
    </div>
  </nav>

  <!-- News Section -->
  <section class="container mx-auto px-6 py-10">
    <h2 class="text-3xl font-bold text-purple-700 mb-6 text-center">Latest Crypto News</h2>
    <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- News cards will load here -->
    </div>
  </section>

  <!-- Script to Fetch News -->
  <script>
    async function loadNews() {
      try {
        let res = await fetch("http://127.0.0.1:8000/news"); // Backend API
        let data = await res.json();

        let newsContainer = document.getElementById("news-container");
        newsContainer.innerHTML = "";

        data.forEach(article => {
          let card = `
            <div class="bg-white shadow-md rounded-lg overflow-hidden hover:shadow-xl transition">
              <img src="${article.image_url || 'https://via.placeholder.com/400'}" alt="News Image" class="w-full h-48 object-cover">
              <div class="p-4">
                <h3 class="text-lg font-semibold text-purple-700 mb-2">${article.title}</h3>
                <p class="text-gray-600 text-sm mb-4">${article.description || "Click below to read more."}</p>
                <a href="${article.url}" target="_blank" class="inline-block bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                  Read More
                </a>
              </div>
            </div>
          `;
          newsContainer.innerHTML += card;
        });
      } catch (err) {
        console.error("Error fetching news:", err);
      }
    }

    loadNews();
  </script>
</body>
</html>
