<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News - CryptoSense AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
    
    * { font-family: 'Space Grotesk', sans-serif; }
    
    body {
      background: #030014;
      color: #E2E8F0;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #8B5CF6 0%, #06B6D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .news-card {
      transition: all 0.3s ease;
    }
    
    .news-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(139, 92, 246, 0.3);
    }
    
    .nav-item:hover, .nav-item.active {
      background: rgba(139, 92, 246, 0.2);
      border-left-color: #8B5CF6;
    }
    
    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 4px solid #8B5CF6;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .category-tag {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
  </style>
</head>
<body class="min-h-screen">
  
  <div class="flex">
    
    <!-- Sidebar -->
    <aside class="w-64 min-h-screen glass-card border-r border-white/5 fixed left-0 top-0 z-50">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-cyan-500 flex items-center justify-center">
            <i class="fas fa-chart-line text-white"></i>
          </div>
          <span class="text-xl font-bold gradient-text">CryptoSense</span>
        </div>
        
        <nav class="space-y-2">
          <a href="dashboard.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white border-l-4 border-transparent">
            <i class="fas fa-th-large w-5"></i>
            <span>Dashboard</span>
          </a>
          <a href="market.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white border-l-4 border-transparent">
            <i class="fas fa-chart-bar w-5"></i>
            <span>Markets</span>
          </a>
          <a href="portfolio.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white border-l-4 border-transparent">
            <i class="fas fa-wallet w-5"></i>
            <span>Portfolio</span>
          </a>
          <a href="news.html" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-white border-l-4 border-transparent">
            <i class="fas fa-newspaper w-5"></i>
            <span>News</span>
          </a>
          <a href="tools.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white border-l-4 border-transparent">
            <i class="fas fa-tools w-5"></i>
            <span>Tools</span>
          </a>
          <a href="learn.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white border-l-4 border-transparent">
            <i class="fas fa-graduation-cap w-5"></i>
            <span>Learn</span>
          </a>
        </nav>
        
        <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-white/5">
          <a href="index.html" class="flex items-center gap-3 text-gray-400 hover:text-white transition">
            <i class="fas fa-home"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
      
      <header class="mb-8" data-aos="fade-down">
        <h1 class="text-3xl font-bold mb-2">Crypto News</h1>
        <p class="text-gray-400">Stay informed with the latest cryptocurrency news and insights</p>
      </header>
      
      <!-- Featured Article -->
      <div id="featured-article" class="glass-card p-0 mb-8 overflow-hidden hidden" data-aos="fade-up">
        <!-- Featured article will be inserted here -->
      </div>
      
      <!-- Loading State -->
      <div id="loading" class="flex flex-col items-center justify-center py-20">
        <div class="loading-spinner mb-4"></div>
        <span class="text-lg text-gray-400">Loading latest news...</span>
      </div>
      
      <!-- Error State -->
      <div id="error-container" class="hidden text-center py-20">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-500/20 mb-6">
          <i class="fas fa-exclamation-triangle text-red-500 text-3xl"></i>
        </div>
        <h3 class="text-2xl font-medium text-gray-300 mb-3">Failed to load news</h3>
        <p class="text-gray-400 mb-6 max-w-md mx-auto">
          Make sure the backend server is running and try again.
        </p>
        <button id="retry-btn" class="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition font-semibold">
          <i class="fas fa-redo mr-2"></i>Try Again
        </button>
      </div>
      
      <!-- News Grid -->
      <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
        <!-- News cards will be dynamically inserted here -->
      </div>
      
      <!-- Load More Button -->
      <div id="load-more-container" class="text-center mt-8 hidden">
        <button id="load-more-btn" class="px-8 py-3 glass-card hover:bg-white/10 transition font-semibold">
          <i class="fas fa-plus mr-2"></i>Load More News
        </button>
      </div>
      
    </main>
  </div>
  
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 800 });
    
    const newsContainer = document.getElementById('news-container');
    const featuredArticle = document.getElementById('featured-article');
    const loadingElement = document.getElementById('loading');
    const errorContainer = document.getElementById('error-container');
    const retryBtn = document.getElementById('retry-btn');
    const loadMoreContainer = document.getElementById('load-more-container');
    
    const BACKEND_URL = 'http://127.0.0.1:8000';
    
    async function fetchNews() {
      try {
        loadingElement.classList.remove('hidden');
        newsContainer.classList.add('hidden');
        featuredArticle.classList.add('hidden');
        errorContainer.classList.add('hidden');
        loadMoreContainer.classList.add('hidden');
        
        const response = await fetch(`${BACKEND_URL}/api/news`);
        
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        
        const data = await response.json();
        displayNews(data.articles);
        
      } catch (error) {
        console.error('Error fetching news:', error);
        loadingElement.classList.add('hidden');
        newsContainer.classList.add('hidden');
        featuredArticle.classList.add('hidden');
        errorContainer.classList.remove('hidden');
      }
    }
    
    function displayNews(articles) {
      newsContainer.innerHTML = '';
      
      if (!articles || articles.length === 0) {
        newsContainer.innerHTML = `
          <div class="col-span-3 text-center py-12">
            <i class="fas fa-newspaper text-4xl text-gray-600 mb-4"></i>
            <p class="text-gray-400">No news articles found.</p>
          </div>
        `;
        loadingElement.classList.add('hidden');
        newsContainer.classList.remove('hidden');
        return;
      }
      
      // Display featured article (first article)
      const featured = articles[0];
      featuredArticle.innerHTML = `
        <div class="grid md:grid-cols-2">
          <div class="h-64 md:h-auto">
            <img src="${featured.urlToImage || 'https://placehold.co/800x400/1a1a2e/8B5CF6?text=Crypto+News'}" 
                 alt="${featured.title}"
                 class="w-full h-full object-cover"
                 onerror="this.onerror=null;this.src='https://placehold.co/800x400/1a1a2e/8B5CF6?text=Crypto+News'">
          </div>
          <div class="p-8 flex flex-col justify-center">
            <span class="category-tag inline-block px-3 py-1 rounded-full text-xs text-purple-300 mb-4 w-fit">
              <i class="fas fa-fire mr-1"></i>Featured
            </span>
            <h2 class="text-2xl font-bold mb-4 leading-tight">${featured.title}</h2>
            <p class="text-gray-400 mb-6 line-clamp-3">${featured.description || 'Click to read more about this cryptocurrency news'}</p>
            <div class="flex items-center justify-between">
              <span class="text-sm text-gray-500">
                <i class="fas fa-clock mr-1"></i>
                ${new Date(featured.publishedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
              </span>
              <a href="${featured.url}" target="_blank" rel="noopener noreferrer" 
                 class="px-6 py-2 bg-gradient-to-r from-purple-600 to-cyan-600 text-white rounded-xl hover:opacity-90 transition font-semibold">
                Read Full Article <i class="fas fa-arrow-right ml-2"></i>
              </a>
            </div>
          </div>
        </div>
      `;
      featuredArticle.classList.remove('hidden');
      
      // Display rest of articles
      articles.slice(1).forEach((article, index) => {
        const newsCard = document.createElement('div');
        newsCard.className = 'news-card glass-card overflow-hidden flex flex-col h-full';
        newsCard.setAttribute('data-aos', 'fade-up');
        newsCard.setAttribute('data-aos-delay', (index % 3) * 100);
        
        newsCard.innerHTML = `
          <div class="relative h-48 overflow-hidden">
            <img src="${article.urlToImage || 'https://placehold.co/400x200/1a1a2e/8B5CF6?text=Crypto+News'}" 
                 alt="${article.title}" 
                 class="w-full h-full object-cover transition-transform hover:scale-110"
                 onerror="this.onerror=null;this.src='https://placehold.co/400x200/1a1a2e/8B5CF6?text=Crypto+News'">
            <div class="absolute top-3 left-3">
              <span class="category-tag px-2 py-1 rounded-full text-xs text-purple-300">
                ${article.source?.name || 'Crypto News'}
              </span>
            </div>
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <h3 class="font-semibold mb-3 line-clamp-2 hover:text-purple-400 transition cursor-pointer">${article.title}</h3>
            <p class="text-gray-400 text-sm mb-4 flex-grow line-clamp-3">${article.description || 'Click to read more about this cryptocurrency news'}</p>
            <div class="flex justify-between items-center mt-auto pt-4 border-t border-white/5">
              <span class="text-xs text-gray-500">
                <i class="fas fa-clock mr-1"></i>
                ${new Date(article.publishedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
              </span>
              <a href="${article.url}" target="_blank" rel="noopener noreferrer" 
                 class="text-sm text-purple-400 hover:text-purple-300 transition font-medium">
                Read More <i class="fas fa-external-link-alt ml-1"></i>
              </a>
            </div>
          </div>
        `;
        
        newsContainer.appendChild(newsCard);
      });
      
      loadingElement.classList.add('hidden');
      newsContainer.classList.remove('hidden');
      loadMoreContainer.classList.remove('hidden');
      
      // Re-initialize AOS for dynamically added elements
      AOS.refresh();
    }
    
    retryBtn.addEventListener('click', fetchNews);
    
    // Initialize
    fetchNews();
  </script>
</body>
</html>
