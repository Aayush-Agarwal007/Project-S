<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto News Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .gradient-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }
    .news-card {
      transition: all 0.3s ease;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 4px solid #6366f1;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="gradient-header text-white shadow-lg">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold">CryptoDash</h1>
      <ul class="flex space-x-6">
        <li><a href="index.html" class="hover:text-gray-200">Home</a></li>
        <li><a href="market.html" class="hover:text-gray-200">Market</a></li>
        <li><a href="news.html" class="font-semibold underline">News</a></li>
      </ul>
    </div>
  </nav>

  <!-- News Section -->
  <section class="container mx-auto px-6 py-10">
    <h2 class="text-3xl font-bold mb-8 text-center bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-500">
      Latest Cryptocurrency News
    </h2>

    <!-- Loading State -->
    <div id="loading" class="flex justify-center items-center py-12">
      <div class="loading-spinner"></div>
      <span class="ml-3 text-lg">Loading news...</span>
    </div>

    <!-- News Cards Container -->
    <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- News cards will be dynamically inserted here -->
    </div>

    <!-- Error State -->
    <div id="error-container" class="hidden text-center py-12">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/20 mb-4">
        <i class="fas fa-exclamation-triangle text-red-500 text-xl"></i>
      </div>
      <h3 class="text-xl font-medium text-gray-300 mb-2">Failed to load news</h3>
      <p class="text-gray-400 mb-4">We couldn't fetch the latest cryptocurrency news.</p>
      <button id="retry-btn" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700">
        Try Again
      </button>
    </div>
  </section>

  <script>
    // DOM Elements
    const newsContainer = document.getElementById('news-container');
    const loadingElement = document.getElementById('loading');
    const errorContainer = document.getElementById('error-container');
    const retryBtn = document.getElementById('retry-btn');

    // API Configuration
    const API_KEY = '7eca9fe48c9d4fa2b0ec4114fecff7f2'; // Replace with your actual News API key
    const API_URL = `https://newsapi.org/v2/everything?q=cryptocurrency&apiKey=${API_KEY}`;

    // Fetch news from News API
    async function fetchNews() {
      try {
        loadingElement.classList.remove('hidden');
        newsContainer.classList.add('hidden');
        errorContainer.classList.add('hidden');

        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await response.json();
        displayNews(data.articles);

      } catch (error) {
        console.error('Error fetching news:', error);
        loadingElement.classList.add('hidden');
        newsContainer.classList.add('hidden');
        errorContainer.classList.remove('hidden');
      }
    }

    // Display news articles
    function displayNews(articles) {
      newsContainer.innerHTML = '';
      
      articles.forEach(article => {
        // Create news card
        const newsCard = document.createElement('div');
        newsCard.className = 'news-card rounded-lg overflow-hidden flex flex-col h-full';
        newsCard.innerHTML = `
          <div class="relative h-48 overflow-hidden">
            <img src="${article.urlToImage || 'https://placehold.co/600x400?text=Crypto+News'}" 
                 alt="${article.title}" 
                 class="w-full h-full object-cover"
                 onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=Crypto+News'">
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-4">
              <h3 class="text-sm font-medium text-white truncate">${article.title}</h3>
            </div>
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <p class="text-gray-300 mb-4 flex-grow">${article.description || 'Click to read more about this cryptocurrency news'}</p>
            <div class="flex justify-between items-center mt-auto">
              <a href="${article.url}" target="_blank" rel="noopener noreferrer" 
                 class="px-3 py-2 text-sm bg-purple-600 hover:bg-purple-700 text-white rounded-md transition">
                Read More <i class="fas fa-external-link-alt ml-1"></i>
              </a>
            </div>
          </div>
        `;
        
        newsContainer.appendChild(newsCard);
      });

      loadingElement.classList.add('hidden');
      newsContainer.classList.remove('hidden');
    }

    // Event Listeners
    retryBtn.addEventListener('click', fetchNews);
    
    // Initialize
    fetchNews();
  </script>
</body>
</html>
